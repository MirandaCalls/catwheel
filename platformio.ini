; Cat wheel tracker firmware for the Raspberry Pi Pico 2 W.
; Uses the earlephilhower Arduino-Pico core via the maxgerhardt PlatformIO platform.

[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
; Flash reserved for LittleFS. Holds the lifetime distance, and must be big
; enough to stage a firmware image during an over-the-air update.
board_build.filesystem_size = 1m
; The micro-USB port runs as a USB host for the mouse (TinyUSB, bundled with
; the core), so logs go to UART0 (Serial1) instead of USB serial.
build_flags =
    -DUSE_TINYUSB
    -DUSE_TINYUSB_HOST
lib_deps =
    https://github.com/knolleary/pubsubclient.git#v2.8
    https://github.com/dawidchyrzynski/arduino-home-assistant.git#2.1.0
monitor_speed = 115200

; Updates over Wi-Fi once the first firmware is flashed: pio run -e ota -t upload
[env:ota]
extends = env:pico2w
upload_protocol = espota
upload_port = catwheel.local
upload_flags =
    --auth=${sysenv.CATWHEEL_OTA_PASSWORD}
