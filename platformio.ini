; Cat wheel tracker firmware for the Raspberry Pi Pico W.
; Uses the earlephilhower Arduino-Pico core via the maxgerhardt PlatformIO platform.

[env:picow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
; Flash reserved for LittleFS. Holds the settings and lifetime distance, and
; must be big enough to stage a firmware image during a web update.
board_build.filesystem_size = 1m
; The micro-USB port runs as a USB host for the mouse (TinyUSB, bundled with
; the core), so logs go to UART0 (Serial1) instead of USB serial.
build_flags =
    -DUSE_TINYUSB
    -DUSE_TINYUSB_HOST
lib_deps =
    https://github.com/knolleary/pubsubclient.git#v2.8
    https://github.com/dawidchyrzynski/arduino-home-assistant.git#2.1.0
monitor_speed = 115200
