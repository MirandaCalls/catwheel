; Cat wheel tracker firmware for the Raspberry Pi Pico 2 W.
; Uses the earlephilhower Arduino-Pico core via the maxgerhardt PlatformIO platform.

[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
; PIO-USB bit-bangs full-speed USB and needs a clock that is a multiple of 120 MHz.
board_build.f_cpu = 120000000L
; Flash reserved for LittleFS (stores the lifetime distance across reboots).
board_build.filesystem_size = 0.5m
build_flags =
    -DUSE_TINYUSB
; Adafruit TinyUSB (the USB host stack) ships with the Arduino-Pico core; point
; at that copy so Pico PIO USB's dependency doesn't pull in a second one.
lib_deps =
    symlink://${platformio.packages_dir}/framework-arduinopico/libraries/Adafruit_TinyUSB_Arduino
    https://github.com/sekigon-gonnoc/Pico-PIO-USB.git#0.7.2
    https://github.com/knolleary/pubsubclient.git#v2.8
    https://github.com/dawidchyrzynski/arduino-home-assistant.git#2.1.0
monitor_speed = 115200
